<!-- Миравен: загрузчик страницы «{{TITLE}}» ({{URL}}). Вставляется один раз в блок T123 на этой странице Тильды. Весь код живёт в репозитории. -->
<div id="miraven-root"></div>
<script>
(function(){
  // адрес, где опубликованы файлы репозитория (GitHub Pages), со слэшем на конце
  var BASE='https://mattshaddd.github.io/MiravenWebSite/';
  /*@PRELOADER@*/
  var FILES=['miraven.css','pages.css','{{PAGE}}.html'];
  PL.total(FILES.length);
  function get(f){return fetch(BASE+f,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(f);return r.text()}).then(function(t){PL.tick();return t})}
  var root=document.getElementById('miraven-root');
  Promise.all(FILES.map(get)).then(function(a){
    var st=document.createElement('style');st.textContent=a[0]+'\n'+a[1];document.head.appendChild(st);
    root.innerHTML=a[2].split('{{BASE}}').join(BASE);
    // тема сайта: сохранённая или системная (та же логика, что на главной)
    var s=null;try{s=localStorage.getItem('miraven-theme')}catch(e){}
    if(s!=='dark'&&s!=='beige')s=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'beige';
    document.documentElement.setAttribute('data-mv-theme',s);
    document.querySelectorAll('.site').forEach(function(x){x.setAttribute('data-theme',s)});
    PL.done();
  }).catch(function(){
    PL.fail();
    root.innerHTML='<p style="padding:40px 20px;text-align:center;font-family:sans-serif">Не удалось загрузить страницу. <a href="/store">Открыть каталог</a></p>';
  });
})();
</script>
